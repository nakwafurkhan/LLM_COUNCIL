<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<title>LLM Council</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   macOS-flavoured design system
   ============================================================ */
:root{
  --sys-blue:#007aff; --sys-purple:#af52de; --sys-green:#34c759;
  --sys-red:#ff3b30; --sys-orange:#ff9500; --sys-teal:#30b0c7; --sys-pink:#ff2d55;

  --bg:#eef0f4;
  --bg-2:#f7f8fa;
  --panel:rgba(255,255,255,.78);
  --panel-solid:#ffffff;
  --chrome:rgba(246,247,250,.72);
  --fill:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.08);
  --ink:#1d1d1f; --ink-2:#54565b; --ink-3:#8e8e93;
  --line:rgba(60,60,67,.13); --line-2:rgba(60,60,67,.07);
  --accent:var(--sys-blue); --chair:var(--sys-purple);
  --ok:#1a8f45; --warn:#b8720a; --err:#d02a20; --err-soft:rgba(255,59,48,.08);

  --r-xl:22px; --r-lg:16px; --r:12px; --r-sm:9px;
  --shadow-1:0 1px 1px rgba(0,0,0,.04), 0 2px 6px rgba(0,0,0,.05);
  --shadow-2:0 4px 14px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow-3:0 20px 60px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.10);
  --knob:0 1px 3px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.04);

  --spring:cubic-bezier(.32,.72,0,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
}
[data-theme="dark"]{
  --bg:#101013;
  --bg-2:#17171b;
  --panel:rgba(30,30,34,.74);
  --panel-solid:#1e1e22;
  --chrome:rgba(24,24,28,.72);
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.14);
  --ink:#f2f2f7; --ink-2:#b4b4bb; --ink-3:#8a8a90;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
  --accent:#0a84ff; --chair:#bf5af2;
  --ok:#30d158; --warn:#ffd60a; --err:#ff453a; --err-soft:rgba(255,69,58,.12);
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 6px 18px rgba(0,0,0,.55);
  --shadow-3:0 24px 70px rgba(0,0,0,.7);
  --knob:0 1px 3px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.06);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb,var(--accent) 11%,transparent), transparent 62%),
    radial-gradient(900px 520px at 92% 0%, color-mix(in srgb,var(--chair) 10%,transparent), transparent 58%),
    var(--bg);
  transition:background-color .4s var(--ease), color .3s var(--ease);
}
button{font:inherit; color:inherit; cursor:pointer; font-family:var(--sans)}
:focus-visible{outline:2.5px solid color-mix(in srgb,var(--accent) 70%,transparent); outline-offset:2px; border-radius:8px}
::selection{background:color-mix(in srgb,var(--accent) 26%,transparent)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(130,130,140,.34);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(130,130,140,.55);background-clip:content-box}

/* ---------------- animation primitives ---------------- */
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideRight{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flipIn{from{opacity:0;transform:rotateX(-12deg) translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s var(--spring) both}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ---------------- toolbar ---------------- */
header{
  flex:0 0 auto; z-index:40; position:relative;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
  padding:10px max(14px,2.4vw); padding-top:max(10px,env(safe-area-inset-top));
  background:var(--chrome);
  -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px);
  border-bottom:.5px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.seal{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:12px;letter-spacing:-.4px;
  background:linear-gradient(150deg,var(--sys-blue),var(--sys-purple));
  box-shadow:0 2px 8px color-mix(in srgb,var(--sys-purple) 34%,transparent), inset 0 .5px 0 rgba(255,255,255,.45);
  transition:transform .45s var(--spring);
}
.brand:hover .seal{transform:rotate(-6deg) scale(1.06)}
.brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.35px;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:450;letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:24ch}
.actions{display:flex;align-items:center;gap:8px;justify-self:end}

/* macOS segmented control */
.segmented{
  position:relative; display:flex; padding:2.5px; gap:2px; border-radius:11px;
  background:var(--fill); justify-self:center;
  box-shadow:inset 0 0 0 .5px var(--line-2);
}
.segmented .knob{
  position:absolute; top:2.5px; bottom:2.5px; left:0; border-radius:8.5px;
  background:var(--panel-solid); box-shadow:var(--knob); z-index:0;
  transition:transform .38s var(--spring), width .38s var(--spring);
  will-change:transform,width;
}
.segmented button{
  position:relative; z-index:1; border:none; background:none; border-radius:8.5px;
  padding:6px 13px; font-size:13px; font-weight:530; color:var(--ink-2);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  transition:color .25s var(--ease), transform .18s var(--ease);
}
.segmented button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.segmented button[aria-pressed=true]{color:var(--ink);font-weight:600}
.segmented button:active{transform:scale(.96)}
.segmented[data-mode=council] .knob{background:linear-gradient(180deg,var(--panel-solid),var(--panel-solid))}
.segmented[data-mode=council] button[aria-pressed=true]{color:var(--chair)}
.segmented[data-mode=study] button[aria-pressed=true]{color:var(--sys-teal)}
.segmented[data-mode=quick] button[aria-pressed=true]{color:var(--accent)}
.segmented[data-mode=humanize] button[aria-pressed=true]{color:var(--sys-green)}

.pill{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;
  border:.5px solid var(--line); background:var(--fill-2); font-size:12.5px; color:var(--ink-2);
  font-weight:500; white-space:nowrap; transition:background .2s var(--ease), transform .12s var(--ease);
}
.pill:hover{background:var(--fill)} .pill:active{transform:scale(.97)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:0 0 auto;transition:background .3s}
.dot.live{background:var(--sys-green);box-shadow:0 0 0 3px color-mix(in srgb,var(--sys-green) 20%,transparent)}
.dot.demo{background:var(--sys-orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--sys-orange) 20%,transparent);animation:pulse 2.6s var(--ease) infinite}
.dot.bad{background:var(--sys-red);box-shadow:0 0 0 3px color-mix(in srgb,var(--sys-red) 20%,transparent)}

.iconbtn{
  min-width:34px;height:34px;padding:0 10px;border-radius:10px;border:.5px solid var(--line);
  background:var(--fill-2); display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:520;
  transition:background .2s var(--ease), transform .12s var(--ease), border-color .2s var(--ease);
}
.iconbtn:hover{background:var(--fill)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:16.5px;height:16.5px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.hide-sm{display:inline}
</style>
