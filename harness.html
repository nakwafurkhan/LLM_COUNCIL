<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Responsive harness</title>
<style>
 body{font:13px ui-monospace,monospace;margin:0;padding:8px;background:#fff}
 #frame{border:1px solid #999;background:#fff;display:block;height:760px;flex:none}
 #out{white-space:pre;font-size:12px;line-height:1.45}
</style></head>
<body>
<iframe id="frame" style="width:390px"></iframe>
<pre id="out">running…</pre>
<script>
/* Point this at a running copy of the app. Serve the folder and open:
     http://localhost:8787/harness.html?src=http://localhost:8787/index.html
   Same-origin is required — the harness reaches into the iframe's DOM. */
const SRC = new URLSearchParams(location.search).get('src') || './index.html';
const log=[];const say=(k,v)=>log.push(String(k).padEnd(30)+': '+v);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function loadAt(px){
  return new Promise(res=>{
    const f=document.getElementById('frame');
    f.style.width=px+'px'; f.onload=()=>setTimeout(()=>res(f),1100);
    f.src='about:blank'; setTimeout(()=>{f.src=SRC},60);
  });
}
const q=(d,s)=>d.querySelector(s), qa=(d,s)=>[...d.querySelectorAll(s)];
async function run(){
  let f=await loadAt(430);
  let w=f.contentWindow,d=f.contentDocument;
  w.localStorage.removeItem('llm-council-runs');

  // --- produce one run in each mode
  for(const [mode,prompt] of [['council','monorepo for 12 people?'],['study','Bayesian inference'],['humanize','Nestled in the heart of the evolving AI landscape, our groundbreaking platform stands as a testament to innovation.']]){
    q(d,'#modeSwitch button[data-run='+mode+']').click(); await wait(240);
    const ta=q(d,'#input'); ta.value=prompt; ta.dispatchEvent(new w.Event('input',{bubbles:true}));
    q(d,'#send').click();
    await wait(mode==='council'?11000:13000);
  }
  const saved=JSON.parse(w.localStorage.getItem('llm-council-runs')||'[]');
  say('runs saved', saved.length+' ['+saved.map(r=>r.mode).join(', ')+']');
  say('council payload', (()=>{const c=saved.find(r=>r.mode==='council');
    return c ? 'seats '+c.payload.seats.length+' | ranking '+(c.payload.ranking?c.payload.ranking.length:0)+' | chair '+(c.payload.chair?'yes':'no') : 'MISSING'})());
  say('study raw chars', (saved.find(r=>r.mode==='study')||{payload:{}}).payload.raw?.length||0);
  say('humanize raw chars', (saved.find(r=>r.mode==='humanize')||{payload:{}}).payload.raw?.length||0);
  say('key in storage?', /rsk_/.test(w.localStorage.getItem('llm-council-runs')||'')?'*** LEAK ***':'no');

  // --- reload, then restore each run from history
  f=await loadAt(430); w=f.contentWindow; d=f.contentDocument;
  say('survived reload', JSON.parse(w.localStorage.getItem('llm-council-runs')||'[]').length+' runs');
  q(d,'#btnHistory').click(); await wait(900);
  say('store badge', q(d,'#storeBadge').textContent);
  const rows=qa(d,'.hrow');
  say('history rows', rows.length);
  say('row titles', JSON.stringify(qa(d,'.htitle').map(e=>e.textContent.slice(0,28))));

  for(let i=rows.length-1;i>=0;i--){
    q(d,'#btnHistory').click(); await wait(700);
    const r=qa(d,'.hrow')[i]; if(!r) continue;
    const label=r.querySelector('.hmeta').textContent.split('·')[0].trim();
    r.querySelector('.hopen').click(); await wait(1200);
    const turn=qa(d,'.turn').pop();
    let detail='';
    if(label==='Council'){
      detail='cards '+turn.querySelectorAll('.card').length+
             ' | chips '+turn.querySelectorAll('.scorechip').length+
             ' | board rows '+turn.querySelectorAll('.brow').length+
             ' | verdict '+(turn.querySelector('.verdict .body')?.textContent.trim().length>80?'yes':'NO')+
             ' | stages '+turn.querySelectorAll('.stagelabel').length;
    } else if(label==='Study'){
      const tabs=qa(d,'.packtabs button').map(b=>b.textContent);
      turn.querySelector('.packtabs button:nth-child(4)')?.click(); await wait(300);
      const flash=turn.querySelectorAll('.flash');
      if(flash[0]) flash[0].click();
      await wait(300);
      detail='tabs '+tabs.length+' | flashcards '+flash.length+
             ' | flip works '+(flash[0]?.getAttribute('aria-pressed')==='true'?'yes':'NO');
    } else {
      const cp=turn.querySelector('.copybtn');
      detail='final chars '+(turn.querySelector('.finaltext')?.textContent.trim().length||0)+
             ' | copy btn '+(cp?'yes':'NO')+
             ' | sections '+turn.querySelectorAll('.hsec').length+
             ' | tells '+turn.querySelectorAll('.tells li').length;
    }
    say('replay '+label, detail);
  }
  say('raw markers leaked', /## (DRAFT|TELLS|FINAL|ORIENT|FLASHCARDS)/.test(d.body.innerText)?'*** YES ***':'no');
  say('h-overflow after replay', d.documentElement.scrollWidth>w.innerWidth+1?'*** YES ***':'no');
}
(async()=>{ try{ await run(); say('RESULT','done') }
  catch(e){ say('ERROR', e.message+' @ '+(e.stack||'').split('\n')[1]) }
  document.getElementById('out').textContent=log.join('\n'); })();
</script>
</body></html>
