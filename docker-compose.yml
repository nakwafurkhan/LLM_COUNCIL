# Local development in containers: the API and the Vite dev server.
#
#   cp .env.example .env    # fill in MESH_API_KEY and MONGODB_URI
#   docker compose up
#
# The database is whatever MONGODB_URI in your .env points at — Atlas, a
# managed host, or a mongod on your machine. This file does NOT override it,
# because silently redirecting your configured database to a throwaway
# container is a nasty surprise when you are wondering where your data went.
#
# If you want a disposable local Mongo instead, add the override file:
#
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up
#
# Client on :5173 (open this one), API on :8787.

services:
  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev:server"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "8787"
      # Only settings that must differ *inside* a container are set here.
      # Everything else, MONGODB_URI included, comes from .env above.
      CORS_ORIGINS: http://localhost:5173
      # Code+PR needs a repo to work against. Mount one below and point this
      # at its path inside the container.
      # REPO_LOCAL_PATH: /repo
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      # Keep container node_modules separate from the host's: native builds
      # differ between an alpine container and a macOS or Windows host, and
      # sharing them produces confusing "invalid ELF header" failures.
      - server-node-modules:/app/node_modules
      # - /absolute/path/to/your/repo:/repo

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev:client -- --host 0.0.0.0"
    restart: unless-stopped
    environment:
      # Inside compose the API is another service, not localhost.
      VITE_API_PROXY_TARGET: http://server:8787
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - client-node-modules:/app/node_modules
    depends_on:
      - server

volumes:
  server-node-modules:
  client-node-modules:
