# One-command local development: Mongo, the API, and the Vite dev server.
#
#   cp .env.example .env    # fill in MESH_API_KEY
#   docker compose up
#
# The client is served by Vite on :5173 and proxies /api to the server on
# :8787. MONGODB_URI is overridden here to point at the mongo service, so the
# value in your .env (which is probably Atlas) is ignored inside compose.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # The server must not start against a Mongo that is still initialising.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev:server"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "8787"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: llm_council
      CORS_ORIGINS: http://localhost:5173
      # Code+PR needs a repo to work against. Mount one below and point this
      # at its path inside the container.
      # REPO_LOCAL_PATH: /repo
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      # Keep container node_modules separate from the host's: native builds
      # differ between an alpine container and a macOS or Windows host.
      - server-node-modules:/app/node_modules
      # - /absolute/path/to/your/repo:/repo
    depends_on:
      mongo:
        condition: service_healthy

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev:client -- --host 0.0.0.0"
    restart: unless-stopped
    environment:
      # Inside compose the API is another service, not localhost.
      VITE_API_PROXY_TARGET: http://server:8787
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - client-node-modules:/app/node_modules
    depends_on:
      - server

volumes:
  mongo-data:
  server-node-modules:
  client-node-modules:
